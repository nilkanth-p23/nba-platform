name: Update predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: read
concurrency:
  group: nba-update
jobs:
  update:
    if: vars.ENABLE_HOSTED_UPDATES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle forecasts from earlier games
        run: python -m pipelines.update backfill
      - name: Ingest and publish
        run: |
          python -m pipelines.update ingest
          python -m pipelines.update publish
